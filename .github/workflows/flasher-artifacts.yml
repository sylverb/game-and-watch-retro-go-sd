# Retro-Go SD 2.0 release producer.
#
# Builds two firmware variants (sd-bank2, flash-bank2), packs each into a
# self-contained install zip, publishes the bank-2 SD updater, and mirrors the
# release to GitHub Pages where a browser can actually read it. Bank 1 is not
# published (dual-boot / bank 2 only).
#
# See docs/RELEASE_2_0.md for the format and why it is shaped this way.
#
# No cores ship here: they are decoupled projects publishing under the GWRG
# distribution spec. Curated cores/homebrews come from
# docs/CURATED_PROJECTS.md → projects.json.
#
# Same filename, two payloads:
#   GitHub release  retro-go_update.bin  — bank2 + /homebrews/installer.bin
#   Pages mirror    retro-go_update.bin  — lean bank2 (no installer; tools/CORS)
# Manifest updates.bank2 hashes/points at the Pages (lean) file.
#
# Pages is the mirror because a GitHub release asset sends no CORS header — `curl`
# gets the bytes, a browser does not. Releases stay the archival source of truth;
# delete the Pages site and this job rebuilds it.
name: release (2.0)

on:
  workflow_dispatch:
    inputs:
      builder_image:
        description: "retro-go-sd builder image"
        default: sylverb/retro-go-sd-builder:v1.5
        type: string
  push:
    # A release comes from a tag. A branch push only builds — it proves the two
    # variants still compile and pack, and stops there: no release, no Pages
    # deploy. Publishing from "whichever commit last touched Core/" would mint
    # releases nobody asked for and race the mirror against itself.
    tags: ['v*']
    branches: [main, web-builder, web-builder-flash]
  pull_request:
    branches: [main, web-builder, web-builder-flash]
    # No paths filter. It would apply to the tag push as well, and a tag pointing
    # at a commit that is already on the remote arrives as a push event with no
    # commits — nothing for a path filter to match, so the release would silently
    # never run. A branch push to web-builder-flash therefore always builds; that
    # branch does not move often enough for the wasted runs to matter, and a
    # release that quietly does not happen is far more expensive than a spare
    # build.

permissions:
  contents: read

concurrency:
  group: retro-go-sd-release
  cancel-in-progress: false

env:
  # One place for the feature set every variant is built with, so the two builds
  # cannot drift apart. MAX_CHEAT_CODES is passed on the command line (NOT a
  # Makefile edit): the stock Makefile only defines it for SD_CARD=1, so
  # CHEAT_CODES=1 SD_CARD=0 needs it supplied here — matching the SD value.
  # All 12 languages: seven locales default on, the four CJK ones do not.
  COMMON_FLAGS: >-
    COVERFLOW=1
    CHEAT_CODES=1
    MAX_CHEAT_CODES=13
    ENABLE_SCREENSHOT=1
    SHARED_HIBERNATE_SAVESTATE=1
    DISABLE_SPLASH_SCREEN=1
    ZH_CN=1
    ZH_TW=1
    KO_KR=1
    JA_JP=1
  # SD-layout install zip (not *-debug.zip — that one is ELF/map only).
  INSTALLER_HOMEBREW_ZIP_URL: https://github.com/sylverb/installer-retro-go-sd/releases/download/v1.0.0/installer-v1.0.0.zip

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true   # one bad image makes the release unpublishable anyway
      matrix:
        include:
          - id: sd-bank2
            sd_card: 1
            bank: 2
          - id: flash-bank2
            sd_card: 0
            bank: 2
    name: build ${{ matrix.id }}
    env:
      BUILDER_IMAGE: ${{ inputs.builder_image || 'sylverb/retro-go-sd-builder:v1.5' }}
    steps:
      - name: Checkout (recursive submodules)
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          submodules: recursive
          # Full history + tags so scripts/update_gittag.sh's `git describe` resolves a
          # real version instead of "NOTAG". GIT_TAG is baked into the firmware and read
          # back out of the image by the packer, so a bogus tag would propagate into the
          # manifest. Every matrix job checks out the same commit, so both agree.
          fetch-depth: 0
          fetch-tags: true

      - name: Build SD_CARD=${{ matrix.sd_card }} bank${{ matrix.bank }}
        run: |
          set -euo pipefail
          # The bank IS the intflash link address. Releases only ship bank 2
          # (dual-boot); bank-1 images are not published.
          #
          # GNW_TARGET is omitted: it is now only an EXTFLASH_SIZE_MB default, and the
          # host resolves extflash geometry through the layout superblock instead.
          #
          # Every job extracts its OWN sd_content. Language blobs are build-specific:
          # lang_t gains 2 fields under CHEAT_CODES=1 and 3 more under INTFLASH_BANK=2,
          # so a blob built for one variant has a different field ORDER than another,
          # and rg_i18n.c truncates a mismatched blob rather than rejecting it — silently
          # wrong menu text in every non-English language. Fonts and the logo happen to
          # be identical across builds, but each zip carries its own copy anyway so a
          # bundle cannot be mis-assembled.
          FLAGS="SD_CARD=${{ matrix.sd_card }} INTFLASH_BANK=${{ matrix.bank }} $COMMON_FLAGS"
          echo "$FLAGS" > _flags.txt
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/opt/workdir" \
            "$BUILDER_IMAGE" \
            bash -l -c "set -e
              make -j\$(nproc) $FLAGS create_sd_data build/gw_retro_go_intflash.bin"

          # Stage under _out/<id>/ so the two jobs' artifacts merge into one tree.
          mkdir -p "_out/${{ matrix.id }}"
          cp build/gw_retro_go_intflash.bin "_out/${{ matrix.id }}/"
          cp build/gw_retro_go.elf          "_out/${{ matrix.id }}/"
          cp _flags.txt                     "_out/${{ matrix.id }}/flags.txt"
          cp -r sd_content                  "_out/${{ matrix.id }}/content"

      - name: Upload ${{ matrix.id }}
        uses: actions/upload-artifact@v6
        with:
          name: build-${{ matrix.id }}
          path: _out/
          retention-days: 1   # intermediates; the release assets are the real output
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the release and upload assets
    outputs:
      tag: ${{ steps.pack.outputs.tag }}
      prerelease: ${{ steps.pack.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true
          # No submodules: this job only runs scripts over what the build jobs produced.

      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: build-*
          merge-multiple: true   # merges the two _out/ trees into one _dl/
          path: _dl

      - name: Check every build arrived
        run: |
          set -euo pipefail
          # merge-multiple is silent about a job that uploaded nothing; a missing build
          # would otherwise surface as a confusing packer error much later.
          for id in sd-bank2 flash-bank2; do
            for f in "_dl/$id/gw_retro_go_intflash.bin" \
                     "_dl/$id/gw_retro_go.elf" \
                     "_dl/$id/flags.txt"; do
              [ -f "$f" ] || { echo "missing: $f"; exit 1; }
            done
            [ -d "_dl/$id/content" ] || { echo "missing content dir for $id"; exit 1; }
          done

      - name: Build transient updater
        run: |
          set -euo pipefail
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/opt/workdir" \
            sylverb/retro-go-sd-builder:v1.5 \
            bash -l -c 'make -j$(nproc) -C external/firmware_update'
          mkdir -p _dl/updater
          cp external/firmware_update/build/firmware_update.bin _dl/updater/

      - name: Build Pages lean retro-go_update.bin (no installer)
        run: |
          set -euo pipefail
          mkdir -p _release _pages_update
          # Lean bank-2 updater for Pages + manifest.hashes. Same public
          # filename as the GitHub asset, different bytes (no installer).
          python3 scripts/flasher/make_update_package.py \
            --updater _dl/updater/firmware_update.bin \
            --content _dl/sd-bank2/content \
            --output _pages_update/retro-go_update.bin

      - name: Build GitHub retro-go_update.bin (bank2 + installer)
        run: |
          set -euo pipefail
          # Do not mutate sd-bank2 content used for the lean package / zips.
          rm -rf _dl/update-with-installer
          cp -a _dl/sd-bank2/content _dl/update-with-installer
          python3 scripts/flasher/bundle_installer_homebrew.py \
            --url "$INSTALLER_HOMEBREW_ZIP_URL" \
            --content _dl/update-with-installer
          python3 scripts/flasher/make_update_package.py \
            --updater _dl/updater/firmware_update.bin \
            --content _dl/update-with-installer \
            --output _release/retro-go_update.bin

      - name: Pack release
        id: pack
        run: |
          set -euo pipefail
          # The tag that triggered this run IS the release. Deriving one with
          # git describe instead would mint "vX.Y.Z-N-gHASH" release tags that
          # nobody created, and each would then be found as the "nearest" tag by
          # the next build and compounded further.
          #
          # This is not the same string as the firmware's baked GIT_TAG, which is
          # still a describe (see scripts/update_gittag.sh) and is published
          # separately as manifest.firmware.gitTag. One names the release, the
          # other identifies the exact build inside it.
          TAG="${GITHUB_REF_NAME}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          # Semver: anything after a hyphen is a prerelease identifier, so v2.0.0-rc1
          # is a prerelease and v2.0.0 is not. Hardcoding prerelease:true would mark
          # every release a prerelease forever; hardcoding false would announce an rc
          # as final. The tag already says which it is.
          case "$TAG" in
            *-*) PRERELEASE=true ;;
            *)   PRERELEASE=false ;;
          esac
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

          python3 scripts/gen_projects_json.py --output _release/projects.json

          BUILD_ARGS=()
          for id in sd-bank2 flash-bank2; do
            storage="${id%%-*}"
            bank="${id##*bank}"
            BUILD_ARGS+=( --build "id=$id,storage=$storage,bank=$bank,image=_dl/$id/gw_retro_go_intflash.bin,elf=_dl/$id/gw_retro_go.elf,content=_dl/$id/content,flags=$(cat "_dl/$id/flags.txt")" )
          done

          # Hash the lean Pages updater (basename retro-go_update.bin).
          python3 scripts/flasher/pack_release.py \
            "${BUILD_ARGS[@]}" \
            --tag "$TAG" \
            --commit "$GITHUB_SHA" \
            --repo "$GITHUB_REPOSITORY" \
            --ref "${GITHUB_REF_NAME}" \
            --built-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            $([ "$PRERELEASE" = true ] && echo --prerelease) \
            --projects _release/projects.json \
            --update-bank2 _pages_update/retro-go_update.bin \
            --out _release

      - name: Build all-builds debug bundle
        run: |
          set -euo pipefail
          rm -rf _debug-all
          mkdir -p _debug-all
          for id in sd-bank2 flash-bank2; do
            mkdir -p "_debug-all/$id"
            unzip -q "_release/retro-go-sd-${GITHUB_REF_NAME}-$id.zip" -d "_debug-all/$id"
          done
          (cd _debug-all && zip -qr "../_release/debug-all-${GITHUB_REF_NAME}.zip" .)

      - name: Compose release notes
        run: |
          set -euo pipefail
          TAG="${{ steps.pack.outputs.tag }}"
          # Pages hosts install zips + lean update + debug for tools (CORS).
          # GitHub release ships retro-go_update.bin with installer embedded.
          # Append the footer with Python (a column-0 shell heredoc breaks YAML).
          python3 - "$TAG" <<'PY' > _release/RELEASE_NOTES.md
          import pathlib, sys
          tag = sys.argv[1]
          text = pathlib.Path("CHANGELOG.md").read_text()
          if not text.endswith("\n"):
              text += "\n"
          footer = f"""
          <details>
          <summary>Automated-tool assets (debug ELFs, install zips)</summary>

          These are published on the Pages mirror next to `manifest.json` (not as
          extra GitHub release downloads):

          - `debug-all-{tag}.zip`
          - `retro-go-sd-{tag}-{{sd,flash}}-bank2.zip`, `manifest.json`, `projects.json`
          - lean `retro-go_update.bin` (no installer — for tools; hashes in the
            manifest match this file)

          Mirror: https://sylverb.github.io/game-and-watch-retro-go-sd/dist/{tag}/

          The `retro-go_update.bin` **on this GitHub release** embeds
          `/homebrews/installer.bin` for first-time core installs. The Pages
          file with the same name does not.

          </details>
          """
          # YAML keeps a common indent on the heredoc body; strip it for Markdown.
          lines = footer.splitlines(True)
          indent = len(lines[1]) - len(lines[1].lstrip()) if len(lines) > 1 else 0
          footer = "".join(l[indent:] if l.startswith(" " * indent) else l for l in lines)
          sys.stdout.write(text + footer)
          PY

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.pack.outputs.tag }}
          name: ${{ steps.pack.outputs.tag }}
          prerelease: ${{ steps.pack.outputs.prerelease }}
          body_path: _release/RELEASE_NOTES.md
          files: |
            _release/retro-go_update.bin

      - name: Stage the Pages mirror for this release
        run: |
          set -euo pipefail
          # Manifest urls are plain filenames beside itself. Publish the LEAN
          # update.bin here — never the GitHub (with-installer) sibling.
          DEST="_pages/dist/${{ steps.pack.outputs.tag }}"
          mkdir -p "$DEST"
          cp _release/*.zip _release/manifest.json _release/projects.json "$DEST/"
          cp _pages_update/retro-go_update.bin "$DEST/"

      - name: Upload Pages staging
        uses: actions/upload-artifact@v6
        with:
          name: pages-staging
          path: _pages/
          retention-days: 1
          if-no-files-found: error

  # Deploy Pages only after the release exists, so the site can never advertise a
  # file that was never published.
  pages:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Download Pages staging
        uses: actions/download-artifact@v7
        with:
          name: pages-staging
          path: _pages

      - name: Mirror the other retained releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The mirror is derived, and each deploy replaces the whole site — so the
          # retained releases have to be fetched back from the Releases API every time
          # rather than carried over from the previous deploy.
          RETAINED=5
          gh release list --repo "$GITHUB_REPOSITORY" --limit 50 \
            --json tagName,publishedAt,isPrerelease > _releases.json

          python3 - <<'PY' > _tags.txt
          import json
          rels = json.load(open("_releases.json"))
          rels.sort(key=lambda r: r.get("publishedAt", ""), reverse=True)
          for r in rels[:5]:
              print(r["tagName"])
          PY

          while read -r tag; do
            [ -n "$tag" ] || continue
            dest="_pages/dist/$tag"
            # This release was staged by the publish job already.
            [ -d "$dest" ] && continue
            mkdir -p "$dest"
            # A release from before this format has no manifest.json; skip it rather
            # than publish a directory an installer cannot read. gen_versions_json.py
            # drops any tag it finds no manifest for.
            if ! gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
                 --dir "$dest" --pattern 'manifest.json' --clobber 2>/dev/null; then
              echo "no manifest.json on $tag; not mirroring"
              rm -rf "$dest"
              continue
            fi
            # A manifest.json is not enough. The old web-artifacts POC published
            # one too, with a completely different shape (id/ref/sha/blobs), and it
            # downloads exactly like ours. Check the shape before mirroring, or the
            # deploy carries a directory no installer can read.
            if ! python3 -c "import json,sys; m=json.load(open(sys.argv[1])); sys.exit(0 if m.get('schemaVersion')==1 and isinstance(m.get('firmware'),dict) else 1)" "$dest/manifest.json"; then
              echo "$tag: manifest.json predates the 2.0 format; not mirroring"
              rm -rf "$dest"
              continue
            fi
            if ! gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
                 --dir "$dest" --pattern '*.zip' --clobber; then
              echo "$tag: manifest.json present but no zips; not mirroring"
              rm -rf "$dest"
              continue
            fi
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
              --dir "$dest" --pattern 'projects.json' --clobber || true
          done < _tags.txt

      - name: Regenerate the index
        run: |
          set -euo pipefail
          python3 scripts/flasher/gen_versions_json.py \
            --dist-dir _pages/dist \
            --releases _releases.json \
            --repo "$GITHUB_REPOSITORY" \
            --retained 5 \
            --out _pages/dist/versions.json
          python3 scripts/flasher/gen_pages_index.py \
            --pages-root _pages \
            --repo "$GITHUB_REPOSITORY"
          echo "--- dist tree ---"
          find _pages -type f | sort

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _pages

      # GITHUB_TOKEN cannot create a Pages site (API returns 403 "Resource not
      # accessible by integration"). Enable it once by hand, then deploys work:
      #   Settings → Pages → Build and deployment → Source: GitHub Actions
      # Site URL: https://<owner>.github.io/<repo>/
      - name: Check GitHub Pages is enabled for Actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! status=$(gh api "repos/${GITHUB_REPOSITORY}/pages" 2>/dev/null); then
            cat <<'EOF'
          ::error::GitHub Pages is not enabled for this repository.

          One-time setup (repo admin):
            1. Open Settings → Pages
            2. Under "Build and deployment", set Source to "GitHub Actions"
            3. Re-run this workflow (or just the pages job)

          The GITHUB_TOKEN cannot create the site via API (HTTP 403). The
          publish job already uploaded the GitHub release; only the Pages
          mirror for automated tools is missing until Pages is enabled.
          EOF
            exit 1
          fi
          build_type=$(printf '%s' "$status" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("build_type") or "")')
          if [ "$build_type" != "workflow" ]; then
            echo "::error::Pages is enabled but build_type=$build_type (need workflow / GitHub Actions). Switch Source to GitHub Actions in Settings → Pages."
            exit 1
          fi
          echo "Pages OK (build_type=workflow)"

      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v5
